name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: fmt
        shell: pwsh
        run: |
          $files = Get-ChildItem src -Recurse -Filter *.rs | ForEach-Object { $_.FullName }
          rustfmt --check --edition 2024 --config skip_children=true @files

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: "policy: no inline allow attribute"
        shell: pwsh
        run: |
          $hits = Get-ChildItem src -Recurse -Filter *.rs |
            Select-String -Pattern '^\s*#!?\[\s*allow\s*\('
          if ($hits) {
            $hits | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            exit 1
          }

      - name: "policy: no TODO/FIXME markers"
        shell: pwsh
        run: |
          $hits = Get-ChildItem src -Recurse -Filter *.rs |
            Select-String -Pattern '//.*\b(TODO|FIXME|HACK|XXX)\b'
          if ($hits) {
            $hits | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            exit 1
          }

      - name: test target compiles
        run: cargo test --locked
