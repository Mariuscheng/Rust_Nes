[package]
name = "rust_nes_emulator"
version = "0.1.0"
edition = "2024"

[dependencies]
minifb = "0.24"
rodio = "0.17"

[features]
# Enables the local-only regression harness in `testing/` (blargg ROM suite and
# golden frames). That directory is not published, so the feature is off by
# default: a fresh clone builds and tests without it.
local_harness = []

